<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSoul</title>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'League Spartan', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        #cover {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
        }
        #cover h1 {
            font-size: 4rem;
            color: #fff;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        #cover p {
            font-size: 1.5rem;
            color: #ccc;
            margin-bottom: 30px;
            font-weight: 400;
            letter-spacing: 1px;
        }
        #start-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 0;
            cursor: pointer;
            font-family: 'League Spartan', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        #start-btn:hover { 
            background: rgba(255,255,255,0.2); 
            transform: scale(1.05);
        }

        .header {
            text-align: center;
            background: #111;
            padding: 30px 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
            color: #fff;
        }
        .header p {
            font-size: 1rem;
            color: #aaa;
            margin: 10px 0 0;
            letter-spacing: 1px;
        }
        
        #search-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 0 20px 20px;
            flex-wrap: wrap;
            position: relative;
        }
        
        .rating-filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 0 20px 20px;
            flex-wrap: wrap;
            width: 100%;
        }
        
        #search-container input, 
        #search-container select,
        .rating-filters input {
            padding: 10px 15px;
            border-radius: 0;
            border: 1px solid #333;
            background: #111;
            color: white;
            font-family: 'League Spartan', sans-serif;
            min-width: 150px;
            font-size: 0.9rem;
        }
        
        .rating-filters input {
            min-width: 120px;
        }
        
        #search-container input:focus, 
        #search-container select:focus,
        .rating-filters input:focus {
            outline: none;
            border-color: #555;
        }
        
        .add-new-container {
            display: flex;
            justify-content: flex-end;
            padding: 0 20px 20px;
        }
        
        .add-new-btn {
            background: #111;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 15px;
            font-size: 0.9rem;
            border-radius: 0;
            cursor: pointer;
            font-family: 'League Spartan', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .add-new-btn:hover {
            background: #1a1a1a;
            border-color: #666;
        }
        
        .container {
            padding: 0 20px 40px;
        }
        
        .month-section {
            width: 100%;
            margin-bottom: 30px;
        }
        
        .month-header {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            margin: 20px 0 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
            letter-spacing: 1px;
        }
        
        .month-movies {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
        }
        
        .card {
            background: #111;
            border-radius: 0;
            width: 300px;
            padding: 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            position: relative;
            border: 1px solid #222;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.7);
        }
        .card img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-bottom: 1px solid #222;
            filter: grayscale(30%);
            transition: filter 0.3s ease;
        }
        .card:hover img {
            filter: grayscale(0%);
        }
        .card-content {
            padding: 20px;
        }
        .card h2 {
            margin: 0 0 15px;
            color: #fff;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .card p {
            margin: 8px 0;
            color: #bbb;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .card strong {
            color: #fff;
            font-weight: 600;
        }
        
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .fetch-btn, .remove-btn, .edit-rating-btn, .theater-toggle {
            padding: 8px 15px;
            border: none;
            font-family: 'League Spartan', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .fetch-btn {
            background: #333;
            color: white;
            flex: 1;
        }
        .fetch-btn:hover { 
            background: #444; 
        }
        .remove-btn {
            background: #222;
            color: white;
            flex: 1;
        }
        .remove-btn:hover { 
            background: #333; 
        }
        .edit-rating-btn {
            background: #444;
            color: white;
        }
        .edit-rating-btn:hover { 
            background: #555; 
        }
        .theater-toggle {
            background: #222;
            color: white;
        }
        .theater-toggle.in-theater {
            background: #4CAF50;
        }
        .theater-toggle:hover {
            opacity: 0.9;
        }
        
        .toggle-line, .rating-line {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }
        .toggle-line strong, .rating-line strong {
            min-width: 80px;
        }
        
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        #add-form {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        #add-form > div {
            background: #111;
            padding: 30px;
            border-radius: 0;
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
        }
        #add-form h2 {
            margin-top: 0;
            color: #fff;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 1.5rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #bbb;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 0;
            border: 1px solid #333;
            background: #000;
            color: white;
            font-family: 'League Spartan', sans-serif;
        }
        #add-form .button-group {
            margin-top: 30px;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            #cover h1 {
                font-size: 2.5rem;
            }
            .card {
                width: 100%;
                max-width: 350px;
            }
            #search-container {
                flex-direction: column;
                align-items: center;
            }
            .add-new-container {
                justify-content: center;
            }
            .rating-filters {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div id="cover">
        <h1>CineSoul</h1>
        <p>A cinematic catalog of watched films</p>
        <button id="start-btn" onclick="enterApp()">Enter Archive</button>
    </div>

    <div id="main-content">
        <div class="header">
            <h1>CineSoul</h1>
            <p>A cinematic catalog of watched films</p>
        </div>
        
        <div id="search-container">
            <input type="text" id="filter-title" placeholder="Search Title">
            <input type="number" id="filter-year" placeholder="Release Year">
            <select id="filter-month">
                <option value="">All Months</option>
                <option value="01">January</option>
                <option value="02">February</option>
                <option value="03">March</option>
                <option value="04">April</option>
                <option value="05">May</option>
                <option value="06">June</option>
                <option value="07">July</option>
                <option value="08">August</option>
                <option value="09">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
            <input type="number" id="filter-year-watched" placeholder="Year Watched" min="1900" max="2099">
        </div>
        
        <div class="rating-filters">
            <input type="number" id="filter-imdb" placeholder="Min IMDb Rating" min="0" max="10" step="0.1">
            <input type="number" id="filter-rt" placeholder="Min RT Rating" min="0" max="100" step="1">
            <input type="number" id="filter-verdict" placeholder="Min Final Verdict" min="0" max="10" step="0.1">
        </div>
        
        <div class="add-new-container">
            <button class="add-new-btn" onclick="showAddForm()">
                <span>+</span>
                <span>Add New Film</span>
            </button>
        </div>
        
        <div class="container" id="container">
            <!-- Movie cards will be inserted here by month -->
        </div>

        <div id="add-form">
            <div>
                <h2>Add New Film</h2>
                <div class="form-group">
                    <label for="title">Film Title:</label>
                    <input type="text" id="title" placeholder="e.g. The Dark Knight">
                </div>
                <div class="form-group">
                    <label for="year">Year of Release (optional):</label>
                    <input type="text" id="year" placeholder="e.g. 2008">
                </div>
                <div class="form-group">
                    <label for="date">Date Watched:</label>
                    <input type="date" id="date">
                </div>
                <div class="button-group">
                    <button class="fetch-btn" onclick="addNewCard()">Add Film</button>
                    <button class="remove-btn" onclick="hideAddForm()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const OMDB_API_KEY = '5b9b7798';
        let movies = JSON.parse(localStorage.getItem('movies')) || [];
        
        function saveMovies() {
            localStorage.setItem('movies', JSON.stringify(movies));
        }

        function enterApp() {
            document.getElementById('cover').style.display = 'none';
            renderMoviesByMonth();
        }

        function sortMoviesByDate() {
            movies.sort((a, b) => {
                if (!a.date && !b.date) return 0;
                if (!a.date) return 1;
                if (!b.date) return -1;
                return new Date(b.date) - new Date(a.date);
            });
        }
        
        function groupMoviesByMonth() {
            const grouped = {};
            
            movies.forEach(movie => {
                if (!movie.date) {
                    if (!grouped['No Date']) {
                        grouped['No Date'] = [];
                    }
                    grouped['No Date'].push(movie);
                    return;
                }
                
                const date = new Date(movie.date);
                const monthYear = date.toLocaleString('default', { month: 'long', year: 'numeric' });
                
                if (!grouped[monthYear]) {
                    grouped[monthYear] = [];
                }
                grouped[monthYear].push(movie);
            });
            
            return grouped;
        }
        
        function renderMoviesByMonth() {
            const container = document.getElementById('container');
            container.innerHTML = '';
            
            sortMoviesByDate();
            const groupedMovies = groupMoviesByMonth();
            
            const monthKeys = Object.keys(groupedMovies).sort((a, b) => {
                if (a === 'No Date') return 1;
                if (b === 'No Date') return -1;
                return new Date(b) - new Date(a);
            });
            
            monthKeys.forEach(month => {
                const monthSection = document.createElement('div');
                monthSection.className = 'month-section';
                
                const monthHeader = document.createElement('h2');
                monthHeader.className = 'month-header';
                monthHeader.textContent = month;
                
                const monthMoviesContainer = document.createElement('div');
                monthMoviesContainer.className = 'month-movies';
                
                groupedMovies[month].forEach(movie => {
                    const card = createMovieCard(movie);
                    monthMoviesContainer.appendChild(card);
                    
                    // Auto-fetch details if not already fetched
                    if (!movie.detailsFetched) {
                        const fetchBtn = card.querySelector('.fetch-btn');
                        setTimeout(() => {
                            fetchDetails(fetchBtn, movie, card);
                        }, 300);
                    }
                });
                
                monthSection.appendChild(monthHeader);
                monthSection.appendChild(monthMoviesContainer);
                container.appendChild(monthSection);
            });
        }
        
        function createMovieCard(movie) {
            const newCard = document.createElement('div');
            newCard.className = 'card';
            const formattedDate = movie.date ? movie.date.split('-').reverse().join('/') : 'Unknown';
            newCard.dataset.title = movie.title.toLowerCase();
            newCard.dataset.year = movie.year;
            newCard.dataset.date = movie.date || '';
            
            newCard.innerHTML = `
                <img src="${movie.poster || 'https://via.placeholder.com/300x450?text=No+Poster'}" alt="Poster">
                <div class="card-content">
                    <h2>${movie.title}</h2>
                    <p><strong>Year:</strong> <span class="year-display">${movie.year || 'Unknown'}</span></p>
                    <p><strong>Date Watched:</strong> ${formattedDate}</p>
                    <p><strong>IMDb:</strong> <span class="imdb">${movie.imdbRating || 'N/A'}</span></p>
                    <p><strong>Rotten Tomatoes:</strong> <span class="rt">${movie.rtRating || 'N/A'}</span></p>
                    <p><strong>Genre:</strong> <span class="genre">${movie.genre || 'Unknown'}</span></p>
                    
                    <div class="rating-line">
                        <strong>Final Verdict:</strong>
                        <span class="rating-display">${movie.rating ? movie.rating + '/10' : 'Not rated'}</span>
                        <button class="edit-rating-btn">Edit</button>
                    </div>
                    
                    <div class="toggle-line">
                        <button class="theater-toggle ${movie.theater ? 'in-theater' : ''}">
                            ${movie.theater ? '🎥 Theater' : '🏠 Home'}
                        </button>
                    </div>
                    
                    <div class="button-group">
                        <button class="fetch-btn">${movie.detailsFetched ? '✅ Data Loaded' : 'Fetch Details'}</button>
                        <button class="remove-btn">Remove</button>
                    </div>
                    
                    <div class="loading" style="display:none;">Loading...</div>
                </div>
            `;
            
            const fetchBtn = newCard.querySelector('.fetch-btn');
            fetchBtn.addEventListener('click', () => fetchDetails(fetchBtn, movie, newCard));
            
            const removeBtn = newCard.querySelector('.remove-btn');
            removeBtn.addEventListener('click', () => removeMovie(movie, newCard));
            
            const editRatingBtn = newCard.querySelector('.edit-rating-btn');
            editRatingBtn.addEventListener('click', () => editRating(movie, newCard));
            
            const theaterToggle = newCard.querySelector('.theater-toggle');
            theaterToggle.addEventListener('click', () => toggleTheater(movie, theaterToggle));

            return newCard;
        }

        function showAddForm() {
            document.getElementById('add-form').style.display = 'flex';
            document.getElementById('title').focus();
        }
        
        function hideAddForm() {
            document.getElementById('add-form').style.display = 'none';
            document.getElementById('title').value = '';
            document.getElementById('year').value = '';
            document.getElementById('date').value = '';
        }

        async function addNewCard() {
            const title = document.getElementById('title').value.trim();
            const year = document.getElementById('year').value.trim();
            const date = document.getElementById('date').value;
    
            if (!title) { 
                alert('Please enter a title'); 
                return; 
            }
    
            hideAddForm();

            const movie = { 
                title, 
                year: year || '', 
                date: date || '', 
                rating: '', 
                poster: '', 
                imdbRating: '', 
                rtRating: '', 
                genre: '', 
                detailsFetched: false,
                theater: false
            };
    
            movies.push(movie);
            saveMovies();
            
            // Clear the container and re-render all movies
            const container = document.getElementById('container');
            container.innerHTML = '';
            
            // Re-render all movies including the new one
            renderMoviesByMonth();
            
            // Apply current filters to show the new movie if it matches
            filterMovies();
            
            // Auto-fetch details for the new movie
            const allCards = Array.from(document.querySelectorAll('.card'));
            let newCard = allCards.find(c =>
            c.dataset.title === movie.title.toLowerCase() &&
            c.dataset.date  === movie.date &&
            c.dataset.year  === movie.year
            );
            if (!newCard) newCard = allCards[allCards.length - 1];

            const fetchBtn = newCard.querySelector('.fetch-btn');
            setTimeout(() => {
            fetchDetails(fetchBtn, movie, newCard);
            }, 300);
        }

        function editRating(movie, card) {
            const current = movie.rating ? movie.rating : '';
            let newRating = prompt('Enter your rating out of 10', current);
            if (newRating === null) return;
            
            newRating = newRating.trim();
            if (newRating === '') {
                movie.rating = '';
            } else {
                const num = parseFloat(newRating);
                if (isNaN(num) || num < 0 || num > 10) {
                    alert('Please enter a number between 0 and 10.');
                    return;
                }
                movie.rating = num.toFixed(1);
            }
            saveMovies();
            card.querySelector('.rating-display').textContent = movie.rating ? movie.rating + '/10' : 'Not rated';
        }

        function toggleTheater(movie, button) {
            movie.theater = !movie.theater;
            saveMovies();
            if (movie.theater) {
                button.textContent = '🎥 Theater';
                button.classList.add('in-theater');
            } else {
                button.textContent = '🏠 Home';
                button.classList.remove('in-theater');
            }
        }

        function removeMovie(movie, card) {
            if (confirm('Are you sure you want to remove this movie?')) {
                const idx = movies.findIndex(m => m.title === movie.title && m.year === movie.year && m.date === movie.date);
                if (idx > -1) { 
                    movies.splice(idx, 1); 
                    saveMovies(); 
                    renderMoviesByMonth();
                    filterMovies();
                }
            }
        }

        function filterMovies() {
            const titleFilter = document.getElementById('filter-title').value.toLowerCase();
            const yearFilter = document.getElementById('filter-year').value.trim();
            const monthFilter = document.getElementById('filter-month').value;
            const yearWatchedFilter = document.getElementById('filter-year-watched').value.trim();
            const imdbFilter = document.getElementById('filter-imdb').value;
            const rtFilter = document.getElementById('filter-rt').value;
            const verdictFilter = document.getElementById('filter-verdict').value;
            
            document.querySelectorAll('.card').forEach(card => {
                const title = card.dataset.title || '';
                const year = card.dataset.year || '';
                const date = card.dataset.date || '';
                
                let monthWatched = '';
                let yearWatched = '';
                if (date) {
                    const parts = date.split('-');
                    if (parts.length === 3) {
                        monthWatched = parts[1];
                        yearWatched = parts[0];
                    }
                }
                
                const imdbRatingText = card.querySelector('.imdb').textContent;
                const rtRatingText = card.querySelector('.rt').textContent;
                const verdictRatingText = card.querySelector('.rating-display').textContent;
                
                const imdbRating = parseFloat(imdbRatingText.split('/')[0]) || 0;
                const rtRating = parseFloat(rtRatingText.replace('%', '')) || 0;
                const verdictRating = parseFloat(verdictRatingText.split('/')[0]) || 0;
                
                const matchesTitle = title.includes(titleFilter);
                const matchesYear = !yearFilter || year === yearFilter;
                const matchesMonth = !monthFilter || monthWatched === monthFilter;
                const matchesYearWatched = !yearWatchedFilter || yearWatched === yearWatchedFilter;
                const matchesImdb = !imdbFilter || imdbRating >= parseFloat(imdbFilter);
                const matchesRt = !rtFilter || rtRating >= parseFloat(rtFilter);
                const matchesVerdict = !verdictFilter || verdictRating >= parseFloat(verdictFilter);
                
                card.style.display = (matchesTitle && matchesYear && matchesMonth && 
                                    matchesYearWatched && matchesImdb && matchesRt && 
                                    matchesVerdict) ? '' : 'none';
            });
            
            document.querySelectorAll('.month-section').forEach(section => {
            // match cards that don’t have “display: none” in their inline style
            const visibleCount = section.querySelectorAll('.card:not([style*="display: none"])').length;
            section.style.display = visibleCount ? '' : 'none';
            }); 
        }

        async function fetchDetails(button, movie, card) {
            const loading = card.querySelector('.loading');
            button.disabled = true;
            loading.style.display = 'flex';

            try {
                let apiUrl = `https://www.omdbapi.com/?t=${encodeURIComponent(movie.title)}&apikey=${OMDB_API_KEY}&plot=full`;
                if (movie.year) apiUrl += `&y=${movie.year}`;
                
                const resp = await fetch(apiUrl);
                const data = await resp.json();
                
                if (data.Response === 'False') {
                    throw new Error(data.Error || 'No data found');
                }

                // Update movie object with new data
                movie.poster = data.Poster !== 'N/A' ? data.Poster : '';
                movie.title = data.Title || movie.title;
                movie.year = data.Year || movie.year;
                movie.imdbRating = data.imdbRating !== 'N/A' ? `${data.imdbRating}/10` : 'N/A';
                
                // Get Rotten Tomatoes rating
                let rtRating = 'N/A';
                if (data.Ratings) {
                    const rtData = data.Ratings.find(r => r.Source === 'Rotten Tomatoes');
                    rtRating = rtData ? rtData.Value : 'N/A';
                }
                movie.rtRating = rtRating;
                
                movie.genre = data.Genre || 'Unknown';
                movie.detailsFetched = true;
                
                saveMovies();
                
                // Update card with new data
                const formattedDate = movie.date ? movie.date.split('-').reverse().join('/') : 'Unknown';
                if (movie.poster) {
                    card.querySelector('img').src = movie.poster;
                }
                card.querySelector('h2').textContent = movie.title;
                card.querySelector('.year-display').textContent = movie.year;
                card.querySelector('p:nth-of-type(2)').innerHTML = `<strong>Date Watched:</strong> ${formattedDate}`;
                card.querySelector('.imdb').textContent = movie.imdbRating;
                card.querySelector('.rt').textContent = movie.rtRating;
                card.querySelector('.genre').textContent = movie.genre;
                card.dataset.year = movie.year;
                
                button.textContent = '✅ Data Loaded';
                filterMovies();
            } catch (err) {
                console.error('Error fetching details:', err);
                button.textContent = '❌ Try Again';
                const errorEl = document.createElement('p');
                errorEl.className = 'error';
                errorEl.textContent = `Error: ${err.message}`;
                card.querySelector('.card-content').appendChild(errorEl);
            } finally {
                loading.style.display = 'none';
                button.disabled = false;
            }
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('filter-title').addEventListener('input', filterMovies);
            document.getElementById('filter-year').addEventListener('input', filterMovies);
            document.getElementById('filter-month').addEventListener('change', filterMovies);
            document.getElementById('filter-year-watched').addEventListener('input', filterMovies);
            document.getElementById('filter-imdb').addEventListener('input', filterMovies);
            document.getElementById('filter-rt').addEventListener('input', filterMovies);
            document.getElementById('filter-verdict').addEventListener('input', filterMovies);
            
            // Set today's date as default in the add form
            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];
            document.getElementById('date').value = dateStr;
        });
    </script>
</body>
</html>
